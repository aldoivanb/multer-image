service: nestjs-api

provider:
  name: aws
  runtime: nodejs16.x
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource: arn:aws:s3:::s3-api-asdfghjkl/*
  region: eu-west-2
  stage: dev
  environment:
    LOG_LEVEL: info
    POWERTOOLS_DEV: "true"
    NODE_OPTIONS: "--enable-source-maps"

functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          path: /{proxy+}
          method: any
          cors: true
plugins:
  - serverless-offline
custom:
  serverless-offline:
    port: 3000
    host: 0.0.0.0

# Desplegar recursos adicionales si los necesitas
resources:
  Resources:
    # Añadir otros recursos si es necesario